# Belmont News on Netlify. Free tier.
# Build command and publish directory are the only two settings a deploy needs;
# the rest are guardrails so a broken build never replaces a good site.
#
# `npm test` first is a guardrail, not a courtesy. gate.yml only runs on pull
# requests, so without it a renderer that renders nothing a reader can see would
# deploy to production with no red check anywhere in the run. A failed build
# leaves the last good deploy live, which is the outcome we want.

# The markdown store is the source of truth, and it lives in a different
# repository. pages.yml already pulls it at build time, so a blog commit
# publishes without touching this repository. Without the same step here, this
# build renders the committed copy of `content/` instead: 4 posts against the 5
# the Pages build serves, and a post that is live on one host is a 404 on the
# other. Same anonymous public clone on both paths, no credential needed.

[build]
  command = "node scripts/sync-content.mjs --from-github EasySchedule/belmont-news-blogs@main && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_POSTHOG_KEY is set in the Netlify site settings, never in this file.

[context.production.environment]
  NODE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/rss"
  to = "/feed.xml"
  status = 301
  force = true
