# Belmont News on Netlify. Free tier.
#
# GitHub Pages is the publish path and the URL the newsroom gives a reader. This
# file exists because the Netlify site is still connected to this repository and
# rebuilds on every push, so its build had to stop being wrong rather than stay
# unused. See "Hosting" in README.md for the measured state of both hosts.
#
# The sync is the load-bearing part. pages.yml pulls the markdown store on the
# GitHub runner and never commits the result back, so `content/` as committed is
# frozen at whatever snapshot was last committed. A build that rendered the
# committed directory served the 2026-10-02 edition indefinitely: 4 posts against
# Pages' 10, `listing.fallback: true`, and a 404 for every 2026-10-05 URL. Syncing
# first means a Netlify build cannot render a stale snapshot whatever is
# committed, so an unwatched second host degrades into a redundant copy instead
# of a wrong one.
#
# `npm test` is a guardrail, not a courtesy. gate.yml only runs on pull
# requests, so without it a renderer that renders nothing a reader can see would
# deploy to production with no red check anywhere in the run. A failed build
# leaves the last good deploy live, which is the outcome we want.

[build]
  command = "npm run sync -- --from-github EasySchedule/belmont-news-blogs@main && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # PUBLIC_POSTHOG_KEY is set in the Netlify site settings, never in this file.

[context.production.environment]
  NODE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/rss"
  to = "/feed.xml"
  status = 301
  force = true
