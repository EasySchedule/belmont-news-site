# Publish the site when the markdown store moves on.
#
# This is the durable trigger BEL-74 asked for. The problem it fixes: pages.yml
# fires on a push to THIS repository, and the markdown store is a different
# repository. So a correct merge to belmont-news-blogs main published nothing,
# failed nothing, and left the reader on a 404 until somebody separately
# remembered to publish. A silent non-publish is the whole defect.
#
# How it works. build.mjs stamps the store commit it rendered into
# /build-info.json, so "is the published site current?" is a lookup rather than
# an inference. This workflow asks that question on a schedule and dispatches
# pages.yml when the answer is no. pages.yml stays the single publish path: this
# file never builds and never deploys, it only decides whether to ask
# pages.yml to run, and the renderer tests and the sourcing gate still run
# inside pages.yml exactly as before.
#
# Deciding to publish and publishing are two facts, and this file used to assert
# only the first. `gh workflow run` was the whole evidence that a deploy would
# follow, and it can exit 0 having achieved nothing: the dispatch endpoint
# answers 204 with no body, which means accepted for processing, not "will run".
# On top of that the run summary printed "Dispatched pages.yml." from the probes'
# *intent*, in a job that did not depend on the dispatch, so it reported success
# on every run where the dispatch had died. Thirteen of twenty-two runs failed at
# this step over two days and nothing in the newsroom was red. The step now waits
# for a pages.yml run to exist, retries, and fails when one never appears, and the
# summary reports the dispatch job's outcome instead of the probes' intention.
# See scripts/publish-now.mjs and test/publish-dispatch.test.mjs.
#
# Why a schedule and not repository_dispatch. BEL-18 section 7.3 asks for a
# cross-repository trigger, and this is the same idea, but the two mechanisms
# that implement it need something this newsroom does not have:
#
#   repository_dispatch  needs a credential in belmont-news-blogs that can
#                        write to belmont-news-site. There are no secrets in
#                        either repository, and minting a cross-repo token is a
#                        credential decision, not a build change.
#   workflow_run         needs the same cross-repo read, for the same reason.
#
# Both also only work if the blogs side is changed and re-deployed in step with
# this side, so the trigger would live in two repositories and break whenever
# one moved. This needs no token at all: the store is public and the deployed
# site is public, so both reads are anonymous. That is also what lets it run on
# a schedule in a repository that holds no credentials.
#
# What it costs. A scheduled run every 15 minutes, and a publish only when the
# store has actually moved, so the common run is two cheap anonymous reads and
# no deploy. GitHub disables scheduled workflows on a repository with no
# activity for 60 days; this repository publishes twice a day.
#
# When the store cannot be reached, or the live site will not say what it
# rendered, check-blogs-ahead.mjs exits 2 and this workflow goes red. That is
# deliberate. The failure being fixed is silence, so a probe that cannot answer
# must be loud rather than read as "nothing to do".

name: Publish on blogs update

on:
  schedule:
    # Every 15 minutes. The newsroom publishes 06:00 and 20:00, so the gap
    # between an edition being merged and a reader seeing it is minutes, not
    # hours. GitHub queues scheduled runs and they can be delayed under load;
    # a missed window is caught by the next one.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Dispatching pages.yml in this repository needs actions: write. This is the
  # repository's own GITHUB_TOKEN, scoped to this repository by the platform.
  # It is not a stored credential and there is nothing to rotate or leak.
  actions: write

concurrency:
  group: publish-on-blogs-update
  cancel-in-progress: false

jobs:
  # Two independent reasons the published site can be behind, and they need two
  # separate checks because they fail on different triggers.
  #
  #   drift    the markdown store moved. Caught by comparing the store's main
  #            against the commit the live site says it rendered.
  #
  #   listing  the newsroom day moved. The front page is a rolling listing now, so
  #            it ages out posts on a day when nobody writes anything and no
  #            commit happens. Caught by comparing the day the live listing was
  #            built for against the day in America/New_York now.
  #
  # Either one dispatches pages.yml, once, through a single dispatch job. Two jobs
  # each dispatching on their own would race and could spend two deploys on the
  # same quiet morning.
  drift:
    name: Is the published site behind the store?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.drift.outputs.publish }}
      exit: ${{ steps.drift.outputs.exit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # exit 0  site is current, nothing to do
      # exit 1  site is behind, publish it
      # exit 2  could not tell, and that is a failure, not a quiet no-op
      #
      # The 1 and 2 outcomes are deliberately different steps. exit 1 is the
      # normal path and must not be able to hide a failure behind it, so the
      # drift check gets its own step and a red check never reaches the
      # dispatch job below.
      - name: Check for drift
        id: drift
        run: |
          set +e
          node scripts/check-blogs-ahead.mjs
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=false" >> "$GITHUB_OUTPUT"; exit "$code" ;;
          esac

  listing:
    name: Is the front page showing an earlier newsroom day?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.listing.outputs.publish }}
      exit: ${{ steps.listing.outputs.exit }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same three exit codes as the drift check, with the same meaning.
      #
      # This one has to exist. Without it a quiet newsroom day, where the store
      # did not move and nothing was committed, would produce no publish at all
      # and the front page would sit there showing yesterday's edition to
      # everybody who came for the 06:00 one. That is the same silent non-publish
      # this workflow already exists to prevent, arrived at from a new direction.
      - name: Check the listing day
        id: listing
        run: |
          set +e
          node scripts/check-listing-stale.mjs
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=false" >> "$GITHUB_OUTPUT"; exit "$code" ;;
          esac

  dispatch:
    name: Publish
    needs: [drift, listing]
    outputs:
      url: ${{ steps.publish.outputs.url }}
    # `always()` so one loud failure does not silently cancel the other reason to
    # publish. A red drift check still has to let a stale listing be republished,
    # or a probe that cannot reach the store would quietly freeze the front page
    # as well as the content. Which reasons applied is in the step summary.
    if: always() && (needs.drift.result == 'success' || needs.listing.result == 'success')
    runs-on: ubuntu-latest
    steps:
      # The checkout is here to get scripts/publish-now.mjs, and nothing else.
      # It is not there for `gh` to read a remote, which is the trap: this job
      # used to run no checkout at all on purpose, and `gh workflow run` without
      # --repo resolves the target from the git remote of the working directory,
      # so thirteen runs in a row died on "fatal: not a git repository" in this
      # last step, after both checks had already decided to publish.
      #
      # publish-now.mjs cannot repeat that. It never asks git anything: the
      # repository is an explicit owner/name and the API base is an explicit URL.
      # No working directory, no remote and no git binary can change its result.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # pages.yml is still the only thing that builds or deploys. This dispatches
      # the same workflow the newsroom ran by hand, so there is still exactly one
      # publish path and nothing to document twice.
      #
      # Both checks run here rather than in their own jobs so that a day that is
      # both behind on content and a day old in the listing still spends one
      # deploy.
      #
      # The step does not end at "the request was accepted". The dispatch endpoint
      # answers 204 with no body, which means accepted for processing and not
      # "will run", so an accepted request that produces no run is the silent
      # non-publish this whole workflow exists to prevent. publish-now.mjs waits
      # for a pages.yml run to actually appear, retries if none does, and exits
      # non-zero if it never appears. A decided publish is now a fact or a red
      # run, and never a quiet success.
      - name: Dispatch the publish
        id: publish
        if: needs.drift.outputs.publish == 'true' || needs.listing.outputs.publish == 'true'
        env:
          # The repository's own token, scoped to this repository by the platform.
          # actions: write is what permits both the dispatch and the listing of
          # runs that confirms it, and write already includes read on the same
          # scope. Not a stored secret, so nothing to rotate and nothing to leak.
          GITHUB_TOKEN: ${{ github.token }}
          # Named explicitly rather than left to GITHUB_REPOSITORY, because the
          # whole defect class here is a publish aimed at the wrong place or at
          # nothing. It should be visible in the file that sends it.
          PUBLISH_REPO: ${{ github.repository }}
          WORKFLOW: pages.yml
          REF: main
          DRIFT: ${{ needs.drift.outputs.publish }}
          LISTING: ${{ needs.listing.outputs.publish }}
        run: |
          echo "drift=${DRIFT} listing=${LISTING}"
          # stdout is the run URL and nothing else, so this captures cleanly.
          # bash runs with -e, so a non-zero exit here fails the step.
          url="$(node scripts/publish-now.mjs)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

  report:
    name: Report
    needs: [drift, listing, dispatch]
    # `dispatch` being in `needs` is the fix, not a detail. It was not here
    # before, so this job could not see whether the publish happened and printed
    # "Dispatched pages.yml." from the *intent* output alone: on every one of the
    # thirteen runs where the dispatch died, this summary said the site had been
    # published, because both probes had said publish=true and the job never
    # learned otherwise. A summary that reports what was intended is worse than
    # no summary, since it is the thing a reader of the run page trusts.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "### Publish check"
            echo
            if [ "${{ needs.drift.outputs.exit }}" == "1" ]; then
              echo "- The markdown store is ahead of the published site."
            elif [ "${{ needs.drift.outputs.exit }}" == "0" ]; then
              echo "- The published site already renders the current store head."
            else
              echo "- **Could not determine whether the content is current.** drift exit \`${{ needs.drift.outputs.exit }}\`. This run is red on purpose; see the step log."
            fi
            if [ "${{ needs.listing.outputs.exit }}" == "1" ]; then
              echo "- The front page listing was built for an earlier newsroom day."
            elif [ "${{ needs.listing.outputs.exit }}" == "0" ]; then
              echo "- The front page listing is current for today in America/New_York."
            else
              echo "- **Could not determine whether the listing is current.** listing exit \`${{ needs.listing.outputs.exit }}\`. This run is red on purpose; see the step log."
            fi
            echo
            # Read the outcome, not the intention. skipped means neither check
            # wanted a publish and the step never ran; success means a pages.yml
            # run was confirmed to exist; anything else means the site was NOT
            # published and the newsroom should know that in the first line they
            # read rather than three lines down.
            if [ "${{ needs.dispatch.result }}" == "success" ]; then
              echo "Dispatched \`pages.yml\`: ${{ needs.dispatch.outputs.url }}"
            elif [ "${{ needs.dispatch.result }}" == "skipped" ]; then
              echo "Nothing to publish. The site already renders the current store head and today's listing."
            else
              echo "- **The publish was decided and did not happen.** \`Dispatch the publish\` returned \`${{ needs.dispatch.result }}\`. The site is NOT published and readers are on an old edition. The step log carries what the API returned on each attempt."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
