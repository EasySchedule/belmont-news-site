# The editorial build gate, on every pull request.
#
# This repository publishes what it renders, so a pull request that would drop
# a source or break a post must be caught before it merges, not after. pages.yml
# already runs the same check on push to main, which is the publish path and
# stays the only place the site is built for production. This workflow is the
# pre-merge half: pull_request only, so main keeps exactly one publish path.
#
# build.mjs exits non-zero when a post does not clear the newsroom standard.
# No step here tolerates a failure.

name: Sourcing gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Editorial gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Validates the committed content snapshot, writes nothing.
      - name: Build gate
        run: node build.mjs --content content --check

  tests:
    name: Renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A source the reader cannot see is a failed publish. The gate above only
      # checks that a post has a non-empty sources list, which a broken parser
      # satisfies while printing nothing. These tests read the rendered HTML.
      #
      # The whole test directory, not one file. Naming render.test.mjs here left
      # test/build.test.mjs with no workflow at all, while its own header claimed
      # "`npm test` runs this on every pull request". A test file that nothing
      # executes is the same hole as a gate that reads nothing, so this is
      # deliberately the same command a developer runs locally.
      - name: node --test
        run: node --test